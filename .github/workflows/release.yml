name: Test and deploy
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: "python -m pip install --only-binary=:all: -r requirements.txt"
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js && node --check static/theme.js && node --check static/draft.js && node --check static/editor.js && node --check static/links.js
      - run: node --test tests/*.test.cjs
      - run: sh -n deploy/backup.sh && bash -n deploy/github-deploy.sh
      - run: docker compose config --quiet
      - run: docker build -t textdrop-test .
  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency:
      group: textdrop-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build exact revision
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "textdrop-release:$GITHUB_SHA" .
      - name: Transfer and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/textdrop ~/.ssh/known_hosts' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/textdrop
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/textdrop ~/.ssh/known_hosts
          docker save "textdrop-release:$GITHUB_SHA" | gzip -1 | ssh -i ~/.ssh/textdrop \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/textdrop-deploy $GITHUB_SHA"
