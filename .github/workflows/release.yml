name: Test and deploy
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: "python -m pip install --only-binary=:all: -r requirements.txt"
      - run: python -m unittest discover -s tests -v
      - run: node --check static/categories.js && node --check static/app.js && node --check static/theme.js && node --check static/draft.js && node --check static/editor.js && node --check static/links.js && node --check static/pwa.js && node --check static/sw.js
      - run: node --test tests/*.test.cjs
      - run: sh -n deploy/backup.sh && bash -n deploy/github-deploy.sh
      - run: docker compose config --quiet
      - run: docker build -t textdrop-test .
      - run: sh deploy/container-smoke.sh textdrop-test linux/amd64
      - name: Install the release bundle from scratch
        run: sh deploy/install-smoke.sh textdrop-test 1.1.1

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency:
      group: textdrop-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build exact revision
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "textdrop-release:$GITHUB_SHA" .
      - name: Transfer and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/textdrop ~/.ssh/known_hosts' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/textdrop
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/textdrop ~/.ssh/known_hosts
          docker save "textdrop-release:$GITHUB_SHA" | gzip -1 | ssh -i ~/.ssh/textdrop \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/textdrop-deploy $GITHUB_SHA"

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' && github.repository == 'DarkRise12/textdrop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: textdrop-image-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate release version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@5138f26214adf9d69718655df70f66d2b3c81db3
      - uses: docker/setup-buildx-action@bf8388060db527dff14f48b6a5fdbe70763c1213
      - uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate for both architectures
        id: build
        uses: docker/build-push-action@562e51947939164e4fe808a6eab5101977e509e0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/darkrise12/textdrop:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Exercise both architectures before publishing release tags
        env:
          IMAGE: ghcr.io/darkrise12/textdrop@${{ steps.build.outputs.digest }}
        run: |
          sh deploy/container-smoke.sh "$IMAGE" linux/amd64
          sh deploy/container-smoke.sh "$IMAGE" linux/arm64
      - name: Publish tested version and latest tags
        env:
          IMAGE: ghcr.io/darkrise12/textdrop@${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "ghcr.io/darkrise12/textdrop:$VERSION" --tag ghcr.io/darkrise12/textdrop:latest "$IMAGE"
